{% extends "base.html" %}

{% block title %}Sign in - AsiPanjabi{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Welcome back</h2>
      <p style="color: var(--color-muted); font-size: 0.9rem;">Sign in to your AsiPanjabi account</p>
    </div>

    <div id="authAlert" style="display: none; padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 1rem;"></div>

    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email address</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; height: 42px; margin-top: 0.5rem;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--color-muted);">
      Don't have an account? <a href="/register" style="color: var(--color-primary); font-weight: 600;">Sign up</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  async function handleLoginSubmit(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const alertBox = document.getElementById('authAlert');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('asipanjabi_token', data.access_token);
        localStorage.setItem('asipanjabi_user', JSON.stringify(data.user));
        alertBox.style.display = 'block';
        alertBox.style.backgroundColor = '#ecfdf5';
        alertBox.style.color = '#047857';
        alertBox.innerText = 'Login successful. Redirecting...';
        setTimeout(() => { window.location.href = '/'; }, 1000);
      } else {
        alertBox.style.display = 'block';
        alertBox.style.backgroundColor = '#fef2f2';
        alertBox.style.color = '#b91c1c';
        alertBox.innerText = data.detail || 'Login failed.';
      }
    } catch (err) {
      alertBox.style.display = 'block';
      alertBox.style.backgroundColor = '#fef2f2';
      alertBox.style.color = '#b91c1c';
      alertBox.innerText = 'An error occurred during login.';
    }
  }
</script>
{% endblock %}
